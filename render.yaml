services:
  - type: web
    name: audit-tools-backend
    env: python
    # NOTE: Keep this minimal; configure secrets (e.g. DATABASE_URL_YEE / DATABASE_URL_PLAYSPACE) in Render's dashboard.
    buildCommand: "python -m pip install -r requirements.txt"
    preDeployCommand: "alembic -x product=yee upgrade yee@head && alembic -x product=playspace upgrade playspace@head"
    startCommand: "python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: "/health"

  # Offline durability: emails auditors whose submit-intent beacon never reached
  # SUBMITTED (the never-arrived detector). The job is idempotent and safe to run
  # repeatedly; --renotify-hours bounds re-notification so it never spams.
  # Configure the same secrets as the web service in Render's dashboard
  # (DATABASE_URL_PLAYSPACE + the email/Brevo keys), ideally via a shared env
  # group, so the job can reach the Playspace DB and send mail.
  - type: cron
    name: audit-tools-stalled-submission-detector
    env: python
    schedule: "0 * * * *" # hourly (UTC)
    buildCommand: "python -m pip install -r requirements.txt"
    startCommand: "python -m app.products.playspace.jobs.stalled_submissions --stall-hours 6 --renotify-hours 24"
